name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build singularity-desktop
        run: nix build ".#packages.${{ matrix.system }}.default" --print-build-logs

      - name: Test package exclusions
        run: nix build ".#checks.${{ matrix.system }}.module-options" ".#checks.${{ matrix.system }}.package-layout" --print-build-logs

      - name: Check flake
        if: matrix.system == 'x86_64-linux'
        run: nix flake check --no-build --all-systems
